
_min_copier_version: "9.10.0"
_subdirectory: template
_answers_file: .copier-generic-project/.copier-go-answers.yml

#===============================================================================
# Interactive

# optional project name
project_name_raw:
  type: str
  qmark: "\n >"
  help: "Project Name:"
  placeholder: "\"\""
  default: "{{_folder_name}}"
  when: >-
    {{ not (
         _folder_name.startswith('bench')
         and _folder_name[5:].isdigit()
       ) }}

# optional project description
project_description:
  type: str
  qmark: "\n >"
  help: "Project Description:"
  placeholder: "\"\""
  default: ""
  when: >-
    {{ not (
         _folder_name.startswith('bench')
         and _folder_name[5:].isdigit()
       ) }}

# project type and features
app_type:
  qmark: "\n >"
  help: "Application Type:"
  type: str
  choices:
    - "CLI"        # cobra cli app
    - "TUI"        # bubbletea tui app
    - "WebServer"  # gin/echo web server

include_database:
  qmark: "\n >"
  help: "Include Database Support (SQLite via GORM):"
  type: bool
  default: false


#===============================================================================
# Deaults
# Saved in ~/.config/copier/settings.yml

user_name:
  when: false

user_email:
  when: false

github_user:
  when: false


#===============================================================================
# Auto-generate

# Capitalised Project Name
project_name:
  default: >-
    {{
      project_name_raw
      | trim
      | title
    }}
  when: false

# kebab-case-project-name
project_slug:
  type: str
  default: >-
    {{
      project_name_raw
      | lower
      | trim
      | regex_replace('[^a-z0-9]+', '-')
      | regex_replace('-+', '-')
      | trim('-')
    }}
  when: false

# snake_case_module_name
module_slug:
  type: str
  default: >-
    {{ project_slug | regex_replace('-', '_') }}
  when: false

# current year for licenses
year:
  type: int
  default: "{{ '%Y' | strftime }}"
  when: false


#===============================================================================
# Tasks

_tasks:
  - command: 'git init'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git branch -M main'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git add --all'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git commit -m "Copy from generic template" -m "https://github.com/karnull/templates"'
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git remote add origin git@github.com:{{ github_user }}/{{ project_slug }}.git'
    when: "{{ _copier_operation == 'copy' }}"

